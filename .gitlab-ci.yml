stages:
  - verify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

cache:
  key:
    prefix: "jdk-$TEST_JAVA_VERSION"
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .gradle/jdks/
  policy: pull-push

verify:
  stage: verify
  image: eclipse-temurin:17-jdk
  parallel:
    matrix:
      - TEST_JAVA_VERSION: ["17", "21", "25"]
  tags:
    - docker
    - linux
    - build01
    - java
  timeout: 15m
  interruptible: true
  script:
    - bash ./gradlew build --stacktrace --no-daemon -PtestJavaVersion=$TEST_JAVA_VERSION
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - modules/*/build/reports/tests/test/
    reports:
      junit:
        - modules/*/build/test-results/test/TEST-*.xml
