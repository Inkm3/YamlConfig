stages:
  - verify
  - quality
  - measure
variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
cache:
  key:
    prefix: "jdk-$TEST_JAVA_VERSION"
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .gradle/jdks/
  policy: pull-push
verify:
  stage: verify
  image: eclipse-temurin:17-jdk
  rules:
    - if: '$ABI_BOOTSTRAP == "true"'
      when: never
    - when: on_success
  parallel:
    matrix:
      - TEST_JAVA_VERSION: ["17", "21", "25"]
  tags: [docker, linux, build01, java]
  timeout: 15m
  interruptible: true
  script:
    - |
      if [ "${FRESH_VERIFY:-false}" = "true" ]; then
        bash ./gradlew build --stacktrace --no-daemon --rerun-tasks --no-build-cache -PtestJavaVersion=$TEST_JAVA_VERSION
      else
        bash ./gradlew build --stacktrace --no-daemon -PtestJavaVersion=$TEST_JAVA_VERSION
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - modules/*/build/reports/tests/test/
    reports:
      junit:
        - modules/*/build/test-results/test/TEST-*.xml
quality:
  stage: quality
  image: eclipse-temurin:17-jdk
  variables:
    TEST_JAVA_VERSION: "17"
  rules:
    - if: '$ABI_BOOTSTRAP == "true"'
      when: never
    - when: on_success
  tags: [docker, linux, build01, java]
  timeout: 15m
  script:
    - bash ci/verify-abi-guard.sh
    - bash ci/verify-consumer.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/abi-guard/
      - build/smoke-repository/
benchmark:
  stage: measure
  image: eclipse-temurin:17-jdk
  variables:
    TEST_JAVA_VERSION: "17"
  rules:
    - if: '$RUN_JMH == "true" && $ABI_BOOTSTRAP != "true"'
  tags: [docker, linux, build01, java]
  timeout: 30m
  script:
    - bash ./gradlew :benchmark:jmh --stacktrace --no-daemon
    - echo JMH_RESULT_JSON_BEGIN
    - cat modules/benchmark/build/reports/jmh/results.json
    - echo JMH_RESULT_JSON_END
  artifacts:
    expire_in: 1 week
    paths:
      - modules/benchmark/build/reports/jmh/
benchmark-comparison:
  stage: measure
  image: eclipse-temurin:17-jdk
  variables:
    TEST_JAVA_VERSION: "17"
  rules:
    - if: '$RUN_JMH_COMPARISON == "true" && $ABI_BOOTSTRAP != "true"'
  tags: [docker, linux, build01, java]
  timeout: 30m
  script:
    - bash ci/compare-sequence-jmh.sh
  artifacts:
    expire_in: 1 week
    paths:
      - modules/benchmark/build/reports/comparison/
      - modules/benchmark/build/reports/comparison.tar.gz
abi-bootstrap:
  stage: verify
  image: eclipse-temurin:17-jdk
  variables:
    TEST_JAVA_VERSION: "17"
  rules:
    - if: '$ABI_BOOTSTRAP == "true"'
  tags: [docker, linux, build01, java]
  timeout: 15m
  script:
    - bash ci/generate-abi.sh
  artifacts:
    expire_in: 1 week
    paths:
      - build/abi-reference.tar.gz
      - modules/core/api/
      - modules/snakeyaml/api/
