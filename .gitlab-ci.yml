stages:
  - verify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
  policy: pull-push

verify:
  stage: verify
  image: eclipse-temurin:17-jdk

  tags:
    - docker
    - linux
    - build01
    - java

  timeout: 15m

  script:
    - bash ./gradlew build --stacktrace --no-daemon

  artifacts:
    when: always
    expire_in: 1 week

    paths:
      - modules/*/build/reports/tests/test/

    reports:
      junit:
        - modules/*/build/test-results/test/TEST-*.xml